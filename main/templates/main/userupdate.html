{% extends 'main/layout.html' %}


{% block body %}

<div class="container"> 
    <h1 class="h3 mb-2 text-primary text-center font-weight-bolder">Update {{ event }}</h1><br>
<form action="" method="POST" class="user" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
        <label> <b> Email: </b> </label>
        {{ form.email }}
    </div>
    <div class="form-group">
        <label> <b> Last Name: </b> </label>
        {{ form.last_name }}
    </div>
    <div class="form-group">
        <label> <b> First Name: </b> </label>
        {{ form.first_name }}
    </div>
    <div class="form-group">
        <label> <b> Password: </b> </label>
        {{ form.password }}
    </div>

    <div class="row mb-4">
        <div class="col-md-12">
            <div class="form-check">
                {{ form.is_staff }}
                <label class="form-check-label font-weight-bold" for="{{ form.is_staff.id_for_label }}">
                    Admin Status (Has administrative capabilities)
                </label>
            </div>
        </div>
    </div>

   <div class="d-flex justify-content-center">
   <input type="submit" value="Save" class="btn btn-primary btn-user  w-25">
   <a href="{{request.META.HTTP_REFERER}}" class="ml-3 btn btn-secondary btn-user  w-25">Cancel</a>
   </div>
</form>
</div>

{% endblock %}
