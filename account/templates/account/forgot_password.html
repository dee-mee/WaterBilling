{% extends 'account/layout.html' %}
{% block body %}
<div style="margin-top: 150px;" class="container">
    <div class="row justify-content-center">
        <div class="col-xl-8 col-lg-10 col-md-10">
            <div class="card o-hidden border-0 shadow-lg my-5" data-aos="fade-up" data-aos-duration="1000" data-aos-easing="ease-in-out">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-3">Forgot Password</h1>
                                    <p class="mb-4 small text-muted">
                                        Enter your registered email address and we'll send you a reset code.
                                    </p>
                                </div>
                                <form method="POST" class="user">
                                    {% csrf_token %}
                                    <div class="form-group">
                                        <input type="email" name="email" class="form-control form-control-user" placeholder="Email address" required>
                                    </div>
                                    <input type="submit" value="Send Reset Code" class="btn btn-primary btn-user btn-block">
                                    {% if error %}
                                    <div class="text-center mt-2">
                                        <small class="text-danger">{{ error }}</small>
                                    </div>
                                    {% endif %}
                                    {% if message %}
                                    <div class="text-center mt-2">
                                        <small class="text-success">{{ message }}</small>
                                    </div>
                                    {% endif %}
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="{% url 'login' %}">Back to Login</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
