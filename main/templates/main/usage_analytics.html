{% extends 'main/layout.html' %}
{% load static %}
{% block body %}
<div class="container-fluid">
    <h1 class="h3 mb-2 text-primary font-weight-bolder">Usage Analytics</h1><br>

    <div class="row">
        <div class="col-xl-8 col-lg-7">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Water Consumption History</h6>
                </div>
                <div class="card-body">
                    <div class="chart-area">
                        <canvas id="myAreaChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-lg-5">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Key Statistics</h6>
                </div>
                <div class="card-body">
                    <p><strong>Average Monthly Usage:</strong> {{ average_usage }} cu.m</p>
                    <p><strong>Highest Consumption:</strong> {{ highest_consumption }} cu.m in {{ highest_consumption_month }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        try {
            var chartLabels = {{ labels|safe }};
            var chartData = {{ data|safe }};
            
            console.log('Usage Analytics Labels:', chartLabels);
            console.log('Usage Analytics Data:', chartData);

            if (!chartLabels || !chartData || chartLabels.length === 0) {
                console.warn('No data available for usage analytics chart');
                return;
            }

            // Get the canvas element
            var ctx = document.getElementById('myAreaChart');
            
            if (!ctx) {
                console.error('Could not find chart canvas element with ID "myAreaChart"');
                return;
            }

            // Check if Chart is defined
            if (typeof Chart === 'undefined') {
                console.error('Chart.js is not loaded');
                return;
            }

            // Create the chart
            new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Water Consumption',
                        data: chartData,
                        borderColor: 'rgba(78, 115, 223, 1)',
                        backgroundColor: 'rgba(78, 115, 223, 0.1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(78, 115, 223, 1)',
                        pointBorderColor: '#fff',
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: 'rgba(78, 115, 223, 1)',
                        pointHoverBorderColor: '#fff',
                        pointHitRadius: 10,
                        pointBorderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            display: false 
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Consumption: ${context.raw} units`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { 
                                display: true, 
                                text: 'Water Consumption (units)',
                                font: {
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                display: true,
                                color: 'rgba(0, 0, 0, 0.05)'
                            },
                            ticks: {
                                precision: 0
                            }
                        },
                        x: {
                            title: { 
                                display: true, 
                                text: 'Billing Period',
                                font: {
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });

            console.log('Usage Analytics chart initialized successfully');
        } catch (error) {
            console.error('Error initializing usage analytics chart:', error);
        }
    });
</script>

{% endblock %}
